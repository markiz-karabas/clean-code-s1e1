<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css">
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
  <body>
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix" >
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">
        Want more details?
      </a>
    </header>
    <main class="container add-task">
        <label class="add-task__title" for="new-task">Add Item</label>
        <div class="add-task__form">
          <input class="task" id='new-task' type="text">
          <button class="add-btn">Add</button>
        </div>
        <h1 class="task-list__title">Todo</h1>
        <ul id="incomplited" class="todo-list">
          <li class="todo-list__item">
            <input class="task-checkbox" type="checkbox">
            <label class="task">Pay Bills</label>
            <input class="task" type="text" >
            <button class="edit-btn">Edit</button>
            <button class="del-btn">
              <img class="remove-icon" src="./remove.svg" alt="remove-icon">
            </button>
          </li>
          <li class="todo-list__item edit-mode">
            <input class="task-checkbox" type="checkbox">
            <label class="task">Go Shopping</label>
            <input class="task" type="text" value="Go Shopping">
            <button class="edit-btn">Save</button>
            <button class="del-btn">
              <img class="remove-icon" src="./remove.svg" alt="remove-icon">
            </button>
          </li>
        </ul>
        <h2 class="task-list__title">Completed</h2>
        <ul id="complited" class="complited-list">
          <li class="complited-list__item">
            <input class="task-checkbox" type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input class="task" type="text" >
            <button class="edit-btn">Edit</button>
            <button class="del-btn">
              <img class="remove-icon" src="./remove.svg" alt="remove-icon">
            </button>
          </li>
        </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
